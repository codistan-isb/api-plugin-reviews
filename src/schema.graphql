type productReview {
  _id: ID!
  productId: ID!
  createdBy: createdByUserinfo!
  review: String!
  score: Float!
  updatedAt: DateTime!
}

type storeReview {
  _id: ID!
  storeName: String!
  createdBy: createdByUserinfo!
  review: String!
  score: Float!
  updatedAt: DateTime!
}

type createdByUserinfo {
  name: String!
  image: String
}
input productReviewInput {
  accountId: ID!
  reviewId: ID
  productId: ID!
  review: String!
  score: Float!
}

input storeReviewInput {
  accountId: ID!
  reviewId: ID
  storeName: String!
  review: String!
  score: Float!
}

extend type Mutation {
  createOrUpdateProductReview(input: productReviewInput): productReview
  createOrUpdateStoreReview(input: storeReviewInput): storeReview
}
extend type Query {
  productReviews(
    productId: ID!
    after: ConnectionCursor
    before: ConnectionCursor
    first: ConnectionLimitInt
    last: ConnectionLimitInt
    offset: Int
    sortOrder: SortOrder = desc
    sortBy: ProductSortByField = createdAt
  ): [productReview]

  storeReviews(
    storeName: ID!
    after: ConnectionCursor
    before: ConnectionCursor
    first: ConnectionLimitInt
    last: ConnectionLimitInt
    offset: Int
    sortOrder: SortOrder = desc
    sortBy: ProductSortByField = createdAt
  ): [storeReview]
}
